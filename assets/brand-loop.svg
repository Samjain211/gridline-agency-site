<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="BRAND surrounded by orbiting brand strategy and identity services">
  <style>
    .orbit{transform-origin:250px 250px;animation:spin 48s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.orbit{animation:none}}
  </style>
  <circle cx="250" cy="250" r="208" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="1" stroke-dasharray="2 10"/>
  <circle cx="250" cy="250" r="145" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="1"/>
  <g class="orbit" fill="#f5f5f2" font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.2" text-anchor="middle">
    <text x="250" y="62">STRATEGY</text>
    <text x="383" y="130" font-size="11">VERBAL IDENTITY</text>
    <text x="435" y="255">VISUAL IDENTITY</text>
    <text x="375" y="388">GUIDELINES</text>
    <text x="250" y="444">COLLATERAL</text>
    <text x="113" y="388" font-size="11">DIGITAL PRESENCE</text>
    <text x="66" y="255">MARKETING</text>
    <text x="121" y="130">EXPERIENCE</text>
  </g>
  <circle cx="250" cy="250" r="109" fill="#090a0a" stroke="#fff" stroke-opacity=".32" stroke-width="1"/>
  <text x="250" y="261" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="5" text-anchor="middle">BRAND</text>
  <circle cx="250" cy="89" r="3" fill="#fff"/>
</svg>
